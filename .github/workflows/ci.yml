# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is documentation-only (release-model = "none"): no main
# branch and no release process, so there is no ci-version-bump job.
jobs:
  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.0
    with:
      language: shell
      versions: '["latest"]'
      container-suffix: base
      container-tag: 'latest'

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.0
    with:
      language: shell
      run-codeql: false
      run-security: ${{ inputs.run-security != 'false' }}
      container-suffix: base
      container-tag: 'latest'
    permissions:
      contents: read
      security-events: write
