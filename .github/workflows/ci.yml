# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.1
    with:
      language: shell
      versions: '["latest"]'
      container-suffix: base
      container-tag: 'latest'

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.1
    with:
      language: shell
      run-codeql: false
      run-security: ${{ inputs.run-security != 'false' }}
      container-suffix: base
      container-tag: 'latest'
    permissions:
      contents: read
      security-events: write
      actions: read

  # This repository is documentation-only (release-model = "none"): no main
  # branch and no release process, so there is nothing to version-bump.
  # The "CI gates" ruleset still lists version / version-bump as a required
  # check, so we run the job with run-release: false. The inner version-bump
  # job is then skipped, reporting the required context as a satisfied no-op
  # without needing an origin/main to diverge from.
  version:
    uses: vergil-project/vergil-actions/.github/workflows/ci-version-bump.yml@v2.1
    with:
      language: shell
      run-release: false
      container-suffix: base
      container-tag: 'latest'
